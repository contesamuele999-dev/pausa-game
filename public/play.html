<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Pausa Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='92'>🎮</text></svg>">
<style>
  :root{ --bg:#0b1020; --card:#151c33; --line:#26304f; --fg:#eef2ff; --dim:#94a3c8;
         --a:#ef4444; --b:#3b82f6; --c:#eab308; --d:#22c55e; --ok:#22c55e; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
       touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:14px;color:var(--dim);flex:0 0 auto}
  header b{color:var(--fg)}
  header .sp{flex:1}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-bottom:16px}

  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  p.dim{color:var(--dim);margin:0}
  input{width:100%;font:600 22px system-ui;background:var(--card);color:var(--fg);border:1px solid var(--line);
        border-radius:14px;padding:16px;text-align:center}
  input#code{letter-spacing:.3em;text-transform:uppercase}
  button{font:700 19px system-ui;background:#233056;color:var(--fg);border:1px solid var(--line);
         border-radius:16px;padding:18px;width:100%;cursor:pointer}
  button.go{background:var(--ok);border-color:var(--ok);color:#052e16}
  button:disabled{opacity:.45}

  .q{font-size:22px;font-weight:700;margin:0 0 4px;text-align:center}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:none;font-size:19px;min-height:72px}
  .opt i{font-style:normal;font-weight:800;opacity:.6}
  .opt.o0{background:var(--a)} .opt.o1{background:var(--b)} .opt.o2{background:var(--c);color:#1a1400} .opt.o3{background:var(--d);color:#052e16}
  .opt.dim{opacity:.25} .opt.win{outline:4px solid #fff;outline-offset:-4px}

  .pad{flex:1;min-height:46vh;border-radius:24px;display:flex;align-items:center;justify-content:center;
       font-size:34px;font-weight:800;text-align:center;padding:20px;border:none;color:#fff}
  .pad.wait{background:#7f1d1d} .pad.go{background:#15803d} .pad.res{background:#1e2745}
  .pad.tap{background:linear-gradient(160deg,#3b82f6,#22c55e);color:#04210f}
  .pad.jump{background:linear-gradient(160deg,#16a34a,#065f46)}
  .pad.duck{background:linear-gradient(160deg,#b45309,#7c2d12)}
  .pad.air{outline:6px solid #fde047;outline-offset:-6px}
  .pad:active{filter:brightness(1.15)}

  /* il personaggio */
  .hero{font-size:64px;line-height:1;display:block;text-align:center}
  .pickme{background:none;border:none;padding:8px;width:auto;margin:0 auto}
  .pickme:active{transform:scale(.92)}

  /* corsa: la pista con sopra il proprio personaggio */
  .strip{position:relative;height:74px;border-radius:18px;background:#0e1530;border:1px solid var(--line);overflow:hidden}
  .strip::after{content:'';position:absolute;right:8px;top:0;bottom:0;width:6px;
                background:repeating-linear-gradient(#fff 0 8px,#111 8px 16px);opacity:.7}
  .strip i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:40px;
           transition:left .12s linear}

  /* salta: la scena dentro il bottone */
  .scene{position:relative;width:100%;height:150px;overflow:hidden}
  .scene::after{content:'';position:absolute;left:0;right:0;bottom:26px;height:3px;background:rgba(255,255,255,.35)}
  .scene i{position:absolute;bottom:30px;font-style:normal;font-size:46px;line-height:1;will-change:bottom,left}
  .scene i#hero{left:16%;transform:translateX(-50%);transition:bottom .19s cubic-bezier(.2,.7,.3,1)}
  .scene i#hero.up{bottom:104px}
  .scene i#ob{transform:translateX(-50%)}
  .scene i#ob.alto{bottom:98px}
  .cuori{letter-spacing:2px}

  /* raccogli: tre corsie, l'oggetto cade, il cestino si sposta */
  .pista{position:relative;flex:1;min-height:46vh;border-radius:24px;overflow:hidden;
         background:linear-gradient(160deg,#111a33,#0b1020);border:1px solid var(--line)}
  .pista .corsie{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
  .pista .corsie button{height:100%;background:none;border:none;border-right:1px dashed #223055;border-radius:0}
  .pista .corsie button:last-child{border-right:none}
  .pista .corsie button:active{background:rgba(96,165,250,.14)}
  .pista .cade{position:absolute;top:0;font-style:normal;font-size:44px;line-height:1;
               transform:translateX(-50%);pointer-events:none;will-change:top}
  .pista .cesto{position:absolute;bottom:14px;font-style:normal;font-size:48px;line-height:1;
                transform:translateX(-50%);pointer-events:none;transition:left .1s ease-out}
  .pista .suolo{position:absolute;left:0;right:0;bottom:70px;height:2px;background:rgba(255,255,255,.18)}

  /* corsa: due pedali da alternare */
  .pedals{flex:1;min-height:42vh;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ped{height:100%;font-size:52px;background:#1e2745;border:2px solid var(--line);opacity:.45}
  .ped.on{opacity:1;background:linear-gradient(160deg,#3b82f6,#1d4ed8);border-color:#60a5fa}
  .ped:active{filter:brightness(1.2)}

  /* colori */
  .stroop{font-size:64px;font-weight:900;text-align:center;line-height:1}
  .ink0{color:var(--a)} .ink1{color:var(--b)} .ink2{color:var(--c)} .ink3{color:var(--d)}
  .sws{flex:1;min-height:38vh;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sws button{height:100%;border:none}
  .bg0{background:var(--a)} .bg1{background:var(--b)} .bg2{background:var(--c)} .bg3{background:var(--d)}
  .sws button.dim{opacity:.2}
  .sws button.win{outline:5px solid #fff;outline-offset:-5px}

  /* come la sala */
  .split{display:flex;height:64px;border-radius:16px;overflow:hidden}
  .split div{display:flex;align-items:center;justify-content:center;font-weight:800;min-width:0;overflow:hidden}

  a.nplus{display:block;text-align:center;font:700 18px system-ui;color:#fff;text-decoration:none;margin-top:8px;
          background:linear-gradient(160deg,#7c3aed,#2563eb);border-radius:16px;padding:18px}

  .bar{height:14px;border-radius:999px;background:#0e1530;border:1px solid var(--line);overflow:hidden}
  .bar>div{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e)}

  ol{list-style:none;margin:0;padding:0}
  ol li{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:15px}
  ol li span{color:var(--dim);min-width:1.6em} ol li b{margin-left:auto}
  .big{font-size:44px;font-weight:800;text-align:center;line-height:1.1}
  .mid{font-size:20px;text-align:center;color:var(--dim)}
  .err{color:#fca5a5;text-align:center;min-height:1.2em}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="bar" class="hide">
    <b id="hname">—</b><span class="sp"></span>
    <span id="hrank"></span><b id="hscore">0</b>
  </header>
  <main id="main"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const LET = ['A','B','C','D'];
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const qs = new URLSearchParams(location.search);

let lastGame = null, ultimaPct = 0;
let ws, pid = null, code = (qs.get('r') || '').toUpperCase(), joined = false, lastHtml = '';

function store(c) { try { return localStorage.getItem('pid:' + c); } catch { return null; } }
function keep(c, v) { try { localStorage.setItem('pid:' + c, v); } catch {} }

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { if (joined) doJoin(); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'err') { $('#err') && ($('#err').textContent = m.msg); joined = false; return; }
    if (m.t === 'joined') { pid = m.pid; keep(m.code, m.pid); joined = true; return; }
    if (m.t === 'you') render(m);
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

let myName = '';
function doJoin() {
  ws.send(JSON.stringify({ t: 'join', code, name: myName, pid: pid || store(code) }));
}

function login() {
  $('#bar').classList.add('hide');
  $('#main').innerHTML = `
    <div><h1>Pausa Game</h1><p class="dim">Entra e gioca con la sala.</p></div>
    <input id="code" maxlength="4" placeholder="CODICE" value="${esc(code)}" autocomplete="off">
    <input id="name" maxlength="14" placeholder="Il tuo nome" autocomplete="off">
    <button class="go" id="enter">ENTRA</button>
    <div class="err" id="err"></div>`;
  const go = () => {
    code = $('#code').value.trim().toUpperCase();
    myName = $('#name').value.trim();
    if (code.length !== 4 || !myName) { $('#err').textContent = 'Serve codice a 4 lettere e nome'; return; }
    pid = store(code);
    joined = true;
    wake();
    if (ws.readyState === 1) doJoin();
  };
  $('#enter').onclick = go;
  $('#name').addEventListener('keydown', (e) => e.key === 'Enter' && go());
  (code ? $('#name') : $('#code')).focus();
}

// Le fasi "live" arrivano 7 volte al secondo: se ricostruissimo il DOM il bottone
// sparirebbe da sotto il dito e i tocchi andrebbero persi. Quelle schermate hanno
// un guscio fisso (#live) e aggiorniamo solo i numeri.
const G = {
  quiz:     { view: quizV },
  riflessi: { view: riflessiV },
  insieme:  { view: insiemeV, can: (v) => v.phase === 'play',  patch: insiemeP },
  corsa:    { view: corsaV,   can: (v) => v.phase === 'gara',  patch: corsaP },
  salto:    { view: saltoV,   can: (v) => v.phase === 'corsa' && v.stato === 'vivo', patch: saltoP },
  rush:     { view: rushV,    can: (v) => v.phase === 'gioco' && v.stato === 'vivo', patch: rushP },
  stop:     { view: stopV },
  colori:   { view: coloriV },
  sala:     { view: salaV }
};

function render(s) {
  $('#bar').classList.remove('hide');
  $('#hname').textContent = s.name;
  $('#hscore').textContent = s.score;
  $('#hrank').textContent = s.rank ? `${s.rank}º di ${s.of} · ` : '';

  lastGame = s.game;
  if (!s.game) return set(lobbyV(s));
  const g = G[s.game];
  if (g.can && g.can(s.view) && $('#live')) { g.patch(s.view, s); lastHtml = null; return; }
  set(g.view(s.view, s));
  if (s.game === 'salto' && s.view.phase === 'corsa' && s.view.stato === 'vivo') volaOstacolo(s.view);
  if (s.game === 'rush' && s.view.phase === 'gioco' && s.view.stato === 'vivo') { rushP(s.view, s); }
  if (s.game === 'stop' && s.view.phase === 'conta') crono(s.view);
}

function set(html) { if (html !== lastHtml) { $('#main').innerHTML = html; lastHtml = html; } }

function lobbyV(s) {
  return `<button class="pickme" data-skin="1"><span class="hero">${s.ch}</span></button>
    <div class="mid">Sei dentro, ${esc(s.name)}.<br>Tocca il personaggio per cambiarlo.</div>
    <div class="mid" style="font-size:16px">Poi aspetta il via dallo schermo.</div>
    ${s.nplus ? `<a class="nplus" href="${esc(s.nplus)}" target="_blank" rel="noopener">🕹️ Apri N+ Arena Stickman</a>` : ''}
    ${s.top.length ? `<ol style="margin-top:20px">${s.top.map((p) => `<li><span>${p.rank}</span>${p.ch} ${esc(p.name)}<b>${p.score}</b></li>`).join('')}</ol>` : ''}`;
}

function fineV(s) {
  return `<div class="big">${s.rank === 1 ? '🥇' : s.rank === 2 ? '🥈' : s.rank === 3 ? '🥉' : '👏'}</div>
    <div class="hero">${s.ch}</div>
    <div class="mid">${s.rank}º su ${s.of} · ${s.score} punti</div>
    <ol style="margin-top:16px">${s.top.map((p) => `<li><span>${p.rank}</span>${p.ch} ${esc(p.name)}<b>${p.score}</b></li>`).join('')}</ol>`;
}

// ---------- quiz: nessun riscontro durante la partita, solo nel ripasso finale
function quizV(v, s) {
  if (v.phase === 'via') return `<div class="big">Pronto?</div><div class="mid">${v.tot} domande</div>`;
  if (v.phase === 'fine') return fineV(s);
  if (v.phase === 'stacco')
    return `<div class="big">✍️</div><div class="mid">Segnata.<br>Le risposte giuste alla fine, tutte insieme.</div>`;

  if (v.phase === 'ripasso') {
    if (v.r < 0) return `<div class="big">🎯</div><div class="mid">Finito.<br>Guarda lo schermo: arrivano le risposte.</div>`;
    return `<div class="mid">Risposta ${v.n}/${v.tot}</div>
      <p class="q">${esc(v.q)}</p>
      <div class="opts">${v.o.map((o, i) => `
        <button class="opt o${i} ${i === v.c ? 'win' : 'dim'}" disabled><i>${LET[i]}</i>${esc(o)}</button>`).join('')}</div>
      <div class="mid">${v.pick == null ? '⏳ Non avevi risposto' : v.ok ? '✅ Giusta!' : '❌ Avevi scelto ' + LET[v.pick]}</div>`;
  }

  return `<div class="mid">Domanda ${v.n}/${v.tot} · ${v.left}s</div>
    <p class="q">${esc(v.q)}</p>
    <div class="opts">${v.o.map((o, i) => `
      <button class="opt o${i} ${v.pick != null && v.pick !== i ? 'dim' : ''}"
        data-pick="${i}" ${v.pick != null ? 'disabled' : ''}><i>${LET[i]}</i>${esc(o)}</button>`).join('')}</div>
    ${v.pick != null ? '<div class="mid">Risposta inviata ✔</div>' : ''}`;
}

// ---------- riflessi
function riflessiV(v, s) {
  if (v.phase === 'fine') return fineV(s);
  if (v.phase === 'esito')
    return `<div class="pad res">${v.early ? 'Partito prima 🙈' : v.ms != null ? v.ms + ' ms' : 'Non hai toccato'}</div>`;
  if (v.phase === 'attesa')
    return `<button class="pad wait" data-tap="1">${v.early ? 'Fermo! Aspetta il prossimo round' : 'ASPETTA il verde…'}</button>`;
  return `<button class="pad go" data-tap="1">${v.ms != null ? v.ms + ' ms' : 'TOCCA!'}</button>`;
}

// ---------- insieme
function insiemeV(v, s) {
  if (v.phase === 'fine') return fineV(s);
  if (v.phase === 'esito') return `<div class="pad res">${v.won ? 'FATTO! 🎉' : 'Quasi…'}</div>`;
  ultimaPct = v.pct;
  return `<div id="live" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <button class="pad tap" data-tap="1">BATTI!<br><span style="font-size:.5em" id="taps">${v.taps} tocchi</span></button>
    <div class="bar"><div id="fill" style="width:${v.pct}%"></div></div>
    <div class="mid" id="meta">Round ${v.n}/${v.tot} · ${v.left}s · ${v.pct}%</div></div>`;
}
function insiemeP(v) {
  ultimaPct = v.pct;
  $('#fill').style.width = v.pct + '%';
  $('#taps').textContent = v.taps + ' tocchi';
  $('#meta').textContent = `Round ${v.n}/${v.tot} · ${v.left}s · ${v.pct}%`;
}

// ---------- corsa: si avanza solo alternando i pedali
function corsaV(v, s) {
  if (v.phase === 'via')
    return `<div class="hero">${s.ch}</div>
      <div class="mid">Alterna i due pedali:<br>sinistra, destra, sinistra…<br><br>Premere sempre lo stesso ti fa sgommare.</div>`;
  if (v.phase === 'fine') return fineV(s);
  myExp = v.exp; // risincronizza quando il guscio viene ricreato
  return `<div id="live" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <div class="mid" id="meta">${v.rank}º di ${v.of} · ${v.pct}%</div>
    <div class="strip"><i id="kart" style="left:${Math.max(6, v.pct)}%">${s.ch}</i></div>
    <div class="pedals">
      <button class="ped ${v.exp === 0 ? 'on' : ''}" id="ped0" data-lane="0">◀</button>
      <button class="ped ${v.exp === 1 ? 'on' : ''}" id="ped1" data-lane="1">▶</button>
    </div></div>`;
}
// Il pedale atteso lo prevede il telefono, non lo aspetta dal server: a 5 tocchi
// al secondo l'evidenziazione arriverebbe sempre un tocco in ritardo. Stessa regola
// del server (si alterna solo quando il pedale e' quello giusto), quindi non divergono.
let myExp = 0;
function pedali() {
  $('#ped0').classList.toggle('on', myExp === 0);
  $('#ped1').classList.toggle('on', myExp === 1);
}
function corsaP(v, s) {
  const k = $('#kart');
  k.style.left = Math.max(6, v.pct) + '%';
  k.textContent = v.turbo ? '🚀' : s.ch; // sulla pedana turbo il personaggio diventa un razzo
  $('#meta').textContent = `${v.rank}º di ${v.of} · ${v.pct}%`;
}

// ---------- salta: 🌵 a terra si salta, 🦅 in alto si resta giù
// Il server trasmette una volta per ostacolo, non 7 volte al secondo: l'ostacolo lo
// fa volare il CSS, che interpola sulla scheda grafica. Risultato fluido anche sui
// telefoni lenti, e il salto parte subito senza aspettare il giro di rete.
const PARTENZA = 104, ARRIVO = 16; // percentuali: da dove entra l'ostacolo e dove colpisce
let airUntil = 0, airMs = 800;

function cuori(v) {
  return '❤️'.repeat(v.vite) + '🖤'.repeat(Math.max(0, v.viteMax - v.vite));
}

function saltoV(v, s) {
  if (v.phase === 'via') {
    airUntil = 0;
    return `<div class="hero">${s.ch}</div><div class="mid">🌵 a terra: <b>salta</b>.<br>🦅 in alto: <b>resta giù</b>.
      <br><br>Hai ${v.viteMax} vite: ${'❤️'.repeat(v.viteMax)}</div>`;
  }
  if (v.phase === 'fine') return fineV(s);
  if (v.stato === 'fuori')
    return `<div class="big">💥</div><div class="hero">${s.ch}</div>
      <div class="mid">Vite finite all'ostacolo ${v.fuoriAl} su ${v.tot}.<br>${v.vivi} ancora in pista.</div>`;
  if (v.stato === 'spettatore')
    return `<div class="hero">${s.ch}</div><div class="mid">Sei entrato a giro iniziato.<br>Guarda e aspetta il prossimo.</div>`;
  airMs = v.airMs;
  return `<div id="live" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <div class="mid" id="meta">Ostacolo ${v.beat}/${v.tot} · <span class="cuori">${cuori(v)}</span> · ${v.vivi} in pista</div>
    <button class="pad ${v.tipo === 0 ? 'jump' : 'duck'}" id="jump" data-tap="1">
      <div style="width:100%">
        <div class="scene">
          <i id="hero">${s.ch}</i>
          <i id="ob" class="${v.tipo === 1 ? 'alto' : ''}">${v.tipo === 0 ? '🌵' : '🦅'}</i>
        </div>
        <span id="sign" style="font-size:24px">${v.tipo === 0 ? '🌵 SALTA' : '🦅 RESTA GIÙ'}</span>
      </div></button></div>`;
}

// Un solo avvio per ostacolo: lo piazza dove si trova ora e lo lascia scorrere
// fino al personaggio nel tempo che manca davvero all'impatto.
function volaOstacolo(v) {
  const ob = $('#ob');
  if (!ob) return;
  const da = ARRIVO + (v.into / v.gap) * (PARTENZA - ARRIVO);
  ob.style.transition = 'none';
  ob.style.left = da + '%';
  void ob.offsetWidth; // forza il reflow, altrimenti il browser fonde le due scritture
  ob.style.transition = `left ${v.into}ms linear`;
  ob.style.left = ARRIVO + '%';
}

function saltoP(v, s) {
  airMs = v.airMs;
  const ob = $('#ob');
  ob.textContent = v.tipo === 0 ? '🌵' : '🦅';
  ob.classList.toggle('alto', v.tipo === 1);
  $('#hero').textContent = s.ch;
  $('#meta').innerHTML = `Ostacolo ${v.beat}/${v.tot} · <span class="cuori">${cuori(v)}</span> · ${v.vivi} in pista`;
  $('#jump').className = 'pad ' + (v.tipo === 0 ? 'jump' : 'duck');
  $('#sign').textContent = v.tipo === 0 ? '🌵 SALTA' : '🦅 RESTA GIÙ';
  volaOstacolo(v);
}

// Il salto e' locale: stessa regola del server (niente doppio salto mentre sei per
// aria), cosi' il personaggio parte al tocco invece che dopo il giro di rete.
function salta() {
  const ora = performance.now();
  if (ora < airUntil) return false;
  airUntil = ora + airMs;
  const h = $('#hero');
  if (h) {
    h.classList.add('up');
    setTimeout(() => h.classList.remove('up'), airMs);
  }
  return true;
}

// ---------- raccogli: il Token Rush, ma con le cadute decise dal server
const CADUTA_FINE = 62; // percentuale di altezza a cui l'oggetto incontra il cestino
let rushLane = 1;

function corsiaX(i) { return (i + 0.5) * (100 / 3); }

function rushV(v, s) {
  if (v.phase === 'via') {
    rushLane = v.cesto;
    return `<div class="hero">${s.ch}</div>
      <div class="mid">Cade qualcosa su <b>tutte e tre</b> le corsie.<br>
      Mettiti sotto 🟢 📝 💎, <b>scappa dai</b> 🐛.<br><br>Restare fermi non e' mai sicuro.
      <br>Hai ${v.viteMax} vite: ${'❤️'.repeat(v.viteMax)}</div>`;
  }
  if (v.phase === 'fine') return fineV(s);
  if (v.stato === 'fuori')
    return `<div class="big">🐛</div><div class="hero">${s.ch}</div>
      <div class="mid">Troppi bug: fuori al numero ${v.fuoriAl} su ${v.tot}.<br>${v.vivi} ancora in gioco.</div>`;
  if (v.stato === 'spettatore')
    return `<div class="hero">${s.ch}</div><div class="mid">Sei entrato a giro iniziato.<br>Guarda e aspetta il prossimo.</div>`;
  rushLane = v.cesto;
  return `<div id="live" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <div class="mid" id="meta"></div>
    <div class="pista">
      <div class="suolo"></div>
      ${v.caduta.map((o, i) => `<i class="cade" id="cade${i}" style="left:${corsiaX(i)}%">${o.e}</i>`).join('')}
      <i class="cesto" id="cesto" style="left:${corsiaX(v.cesto)}%">${s.ch}</i>
      <div class="corsie">
        <button data-lane="0"></button><button data-lane="1"></button><button data-lane="2"></button>
      </div>
    </div></div>`;
}

// Come per Salta: una sola animazione per giro, lunga quanto manca davvero.
function cadeOggetto(v) {
  const da = CADUTA_FINE * (1 - v.into / v.gap);
  for (let i = 0; i < v.caduta.length; i++) {
    const el = $('#cade' + i);
    if (!el) continue;
    el.textContent = v.caduta[i].e;
    el.style.transition = 'none';
    el.style.top = da + '%';
    void el.offsetWidth;
    el.style.transition = `top ${v.into}ms linear`;
    el.style.top = CADUTA_FINE + '%';
  }
}

function rushP(v, s) {
  $('#cesto').textContent = s.ch;
  $('#meta').innerHTML = `${v.beat}/${v.tot} · <span class="cuori">${cuori(v)}</span>`
    + (v.combo > 1 ? ` · <b>x${v.combo}</b>` : '');
  rushLane = v.cesto;
  muoviCesto();
  cadeOggetto(v);
}

function muoviCesto() {
  const c = $('#cesto');
  if (c) c.style.left = corsiaX(rushLane) + '%';
}

// ---------- stop: il cronometro sparisce dopo 3 secondi, si conta a mente
const secondi = (ms) => (ms / 1000).toFixed(2);
let cronoT0 = 0, cronoShow = 0, cronoRaf = 0;

function stopV(v, s) {
  if (v.phase === 'via')
    return `<div class="hero">⏱️</div><div class="mid">Il cronometro parte e dopo 3 secondi <b>sparisce</b>.<br>
      Tocca STOP quando pensi sia arrivato al secondo giusto.</div>`;
  if (v.phase === 'fine') return fineV(s);
  if (v.phase === 'esito') {
    if (v.ms == null) return `<div class="pad res">Non hai fermato ⏳<br>Obiettivo ${v.target / 1000} s</div>`;
    const d = Math.abs(v.diff);
    return `<div class="pad res" style="flex-direction:column">
      <div>${d <= 50 ? '🎯 PERFETTO!' : secondi(v.ms) + ' s'}</div>
      <div style="font-size:20px;opacity:.8;margin-top:8px">obiettivo ${v.target / 1000} s · ${d <= 50 ? '' : (v.diff > 0 ? 'tardi di ' : 'presto di ') + secondi(d) + ' s · '}+${v.pts}</div></div>`;
  }
  if (v.fermo) return `<div class="pad res">✋ Fermato!<br><span style="font-size:.55em">Il tempo lo scopri a fine round</span></div>`;
  return `<button class="pad go" data-tap="1" style="flex-direction:column">
    <div style="font-size:22px">Ferma a ${v.target / 1000} secondi</div>
    <div id="crono" style="font-size:64px;font-variant-numeric:tabular-nums">0.00</div>
    <div>STOP ✋</div></button>`;
}
function crono(v) {
  cronoT0 = performance.now() - v.el;
  cronoShow = v.show;
  if (!cronoRaf) cronoRaf = requestAnimationFrame(giraCrono);
}
function giraCrono() {
  const el = $('#crono');
  if (!el) { cronoRaf = 0; return; }
  const t = performance.now() - cronoT0;
  el.textContent = t < cronoShow ? secondi(t) : '🙈';
  cronoRaf = requestAnimationFrame(giraCrono);
}

// ---------- colori: la parola ROSSO scritta in blu
function coloriV(v, s) {
  if (v.phase === 'via')
    return `<div class="hero">🎨</div><div class="mid">Compare una parola colorata.<br>
      Leggi cosa chiede: <b>il COLORE</b> dell'inchiostro<br>oppure <b>la PAROLA</b> scritta.<br><br>Più sei veloce, più punti.</div>`;
  if (v.phase === 'fine') return fineV(s);
  const cosa = v.chiedi === 'colore' ? 'il <b>COLORE</b>' : 'la <b>PAROLA</b>';
  const esito = v.phase === 'stacco'
    ? `<div class="mid">${v.ok ? '✅ Giusto!' : v.ok === false ? '❌ Sbagliato' : '⏳ Troppo lento'}</div>` : '';
  return `<div class="mid">${v.n}/${v.tot} · tocca ${cosa}</div>
    <div class="stroop ink${v.ink}">${v.parola}</div>${esito}
    <div class="sws">${[0, 1, 2, 3].map((i) => `<button class="bg${i} ${v.pick != null && v.pick !== i ? 'dim' : ''} ${v.pick === i ? 'win' : ''}"
      data-pick="${i}" ${v.pick != null || v.phase !== 'domanda' ? 'disabled' : ''} aria-label="${['rosso', 'blu', 'giallo', 'verde'][i]}"></button>`).join('')}</div>`;
}

// ---------- come la sala: indovina la maggioranza
function salaV(v, s) {
  if (v.phase === 'via')
    return `<div class="hero">🤝</div><div class="mid">Non conta cosa preferisci tu.<br>
      Vince chi indovina cosa sceglie <b>la maggioranza</b>.</div>`;
  if (v.phase === 'fine') return fineV(s);
  if (v.phase === 'esito') {
    const tot = v.conta[0] + v.conta[1];
    const pct = tot ? Math.round((v.conta[0] / tot) * 100) : 50;
    const mio = v.pick == null ? '⏳ Non hai votato' : v.vince.includes(v.pick)
      ? (v.vince.length === 2 ? '🤝 Pareggio: mezzo premio' : '✅ Eri con la sala!') : '❌ Controcorrente';
    return `<div class="big">${mio}</div>
      <div class="split"><div class="bg0" style="width:${pct}%">${pct}%</div><div class="bg1" style="width:${100 - pct}%">${100 - pct}%</div></div>
      <div style="display:flex;justify-content:space-between" class="mid"><span>${esc(v.o[0])}</span><span>${esc(v.o[1])}</span></div>`;
  }
  return `<div class="mid">${v.n}/${v.tot} · ${v.left}s</div>
    <p class="q">Cosa sceglie la sala?</p>
    <div class="opts">${v.o.map((o, i) => `
      <button class="opt o${i} ${v.pick != null && v.pick !== i ? 'dim' : ''}" style="justify-content:center;font-size:26px;min-height:120px"
        data-pick="${i}" ${v.pick != null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${v.pick != null ? '<div class="mid">Voto inviato ✔</div>' : ''}`;
}

// un solo listener: i bottoni vengono ridisegnati a ogni cambio di fase
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pick],[data-tap],[data-lane],[data-skin]');
  if (!b || ws.readyState !== 1) return;
  if (navigator.vibrate) navigator.vibrate(12);
  if (b.dataset.skin) return ws.send(JSON.stringify({ t: 'skin' }));
  if (b.id === 'jump') { salta(); return ws.send(JSON.stringify({ tap: 1 })); }
  if (b.classList.contains('tap')) colpo(240 + ultimaPct * 4); // Insieme: il tono sale col riempirsi della barra
  if (b.dataset.lane && G[lastGame] === G.rush) {
    rushLane = +b.dataset.lane;
    muoviCesto(); // si muove al tocco, senza aspettare il giro di rete
    return ws.send(JSON.stringify({ lane: rushLane }));
  }
  if (b.dataset.lane) {
    const lane = +b.dataset.lane;
    if (lane === myExp) { myExp = 1 - myExp; pedali(); } // previsione locale, niente attesa
    return ws.send(JSON.stringify({ lane }));
  }
  ws.send(JSON.stringify(b.dataset.tap ? { tap: 1 } : { pick: +b.dataset.pick }));
});

// Un colpo secco a ogni battuta. Generato al volo: nessun file da scaricare, e il
// contesto audio nasce al primo tocco, l'unico momento in cui iOS lo lascia partire.
let ac = null;
function colpo(freq) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const vol = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, t + 0.09);
    vol.gain.setValueAtTime(0.0001, t);
    vol.gain.exponentialRampToValueAtTime(0.3, t + 0.004);
    vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    osc.connect(vol).connect(ac.destination);
    osc.start(t);
    osc.stop(t + 0.11);
  } catch {} // telefono in silenzioso o audio negato: si gioca lo stesso
}

// lo schermo del telefono non deve bloccarsi a meta' partita
async function wake() { try { await navigator.wakeLock.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());

login();
connect();
</script>
