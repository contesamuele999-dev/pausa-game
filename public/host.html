<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pausa Game — Schermo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='92'>🏆</text></svg>">
<style>
  :root{
    --bg:#0b1020; --card:#151c33; --line:#26304f; --fg:#eef2ff; --dim:#94a3c8;
    --a:#ef4444; --b:#3b82f6; --c:#eab308; --d:#22c55e; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #app{height:100vh;display:flex;flex-direction:column;padding:2.2vh 2.5vw;gap:2vh}
  header{display:flex;align-items:center;gap:1.5rem;flex:0 0 auto}
  header h1{margin:0;font-size:clamp(20px,2.4vw,34px);letter-spacing:-.02em}
  header .sp{flex:1}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.5rem 1.1rem;font-size:clamp(14px,1.3vw,20px);color:var(--dim)}
  main{flex:1;min-height:0;display:flex;gap:2.5vw}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:2vh}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2vh 1.6vw}
  .grow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}

  .code{font-size:clamp(48px,11vw,170px);font-weight:800;letter-spacing:.12em;line-height:1;text-align:center}
  .qr{display:block;width:min(34vh,90%);margin:0 auto;border-radius:16px}
  .url{text-align:center;color:var(--dim);font-size:clamp(13px,1.2vw,18px);word-break:break-all;margin-top:1vh}

  .names{display:flex;flex-wrap:wrap;gap:.6rem;align-content:flex-start;overflow:auto}
  .name{background:#1e2745;border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:clamp(14px,1.3vw,22px)}
  .name.off{opacity:.4}

  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
  button{font:inherit;font-weight:700;background:#233056;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:1rem .6rem;cursor:pointer;font-size:clamp(13px,1.1vw,18px)}
  button:hover{background:#2c3b6b}
  button.go{background:var(--ok);border-color:var(--ok);color:#052e16}
  button.stop{background:#3a2030;border-color:#5b2740;color:#fca5a5}

  .q{font-size:clamp(24px,3.4vw,58px);font-weight:700;text-align:center;margin:0 0 2vh}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh 1.2vw}
  .opt{border-radius:16px;padding:2vh 1.2vw;font-size:clamp(18px,2vw,34px);font-weight:600;display:flex;align-items:center;gap:1rem;opacity:.95}
  .opt i{font-style:normal;font-weight:800;opacity:.55;min-width:1.4em}
  .opt b{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.8}
  .opt.o0{background:var(--a)} .opt.o1{background:var(--b)} .opt.o2{background:var(--c);color:#1a1400} .opt.o3{background:var(--d);color:#052e16}
  .opt.dim{opacity:.22}
  .opt.win{outline:6px solid #fff;outline-offset:-6px}

  .big{font-size:clamp(40px,8vw,140px);font-weight:800;text-align:center;line-height:1.05}
  .sub{text-align:center;color:var(--dim);font-size:clamp(16px,1.6vw,26px)}

  .light{flex:1;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,6vw,110px);font-weight:800;text-align:center}
  .light.wait{background:#7f1d1d} .light.go{background:#15803d} .light.res{background:#1e2745}

  .bar{height:12vh;border-radius:999px;background:#0e1530;border:1px solid var(--line);overflow:hidden}
  .bar>div{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .12s linear}

  /* corsa */
  .lanes{display:flex;flex-direction:column;gap:.9vh;overflow:hidden}
  .lane{display:flex;align-items:center;gap:.8rem;font-size:clamp(13px,1.3vw,22px)}
  .lane u{text-decoration:none;color:var(--dim);min-width:1.6em;text-align:right}
  .lane em{font-style:normal;min-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{flex:1;height:3.4vh;border-radius:999px;background:#0e1530;border:1px solid var(--line);position:relative}
  .track i{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-size:2.6vh;transition:left .12s linear}
  .turbo{filter:drop-shadow(0 0 7px #fbbf24)}

  /* salta */
  .run{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
  .sign{font-size:clamp(60px,12vw,190px);line-height:1}
  .timer{width:70%;height:3vh;border-radius:999px;background:#0e1530;border:1px solid var(--line);overflow:hidden}
  .timer>div{height:100%;background:#f59e0b}

  ol.board{list-style:none;margin:0;padding:0;overflow:auto}
  ol.board li{display:flex;align-items:center;gap:1rem;padding:.7vh .4rem;font-size:clamp(15px,1.5vw,26px);border-bottom:1px solid var(--line)}
  ol.board li span{color:var(--dim);min-width:2.2em}
  ol.board li b{margin-left:auto;font-variant-numeric:tabular-nums}
  ol.board li:nth-child(1) b{color:#fde047} ol.board li:nth-child(2) b{color:#e2e8f0} ol.board li:nth-child(3) b{color:#fdba74}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pausa Game</h1>
    <span class="pill" id="hgame">Sala d'attesa</span>
    <span class="sp"></span>
    <span class="pill" id="hcount">0 giocatori</span>
    <span class="pill" id="hcode">----</span>
  </header>

  <main>
    <!-- LOBBY -->
    <section class="col" id="lobby">
      <div class="card grow">
        <div class="code" id="lcode">----</div>
        <img class="qr" id="lqr" alt="QR per entrare">
        <div class="url" id="lurl"></div>
      </div>
    </section>

    <!-- PARTITA -->
    <section class="col hide" id="stage">
      <div class="card grow" id="stagebox"></div>
    </section>

    <!-- COLONNA DESTRA -->
    <section class="col" style="flex:.85">
      <div class="card grow">
        <div class="url" style="margin:0 0 1vh">IN SALA</div>
        <div class="names" id="names"></div>
        <ol class="board hide" id="board"></ol>
      </div>
      <div class="card">
        <div class="btns" id="menu">
          <button data-g="quiz" data-l="bambini">Quiz bambini</button>
          <button data-g="quiz" data-l="ragazzi">Quiz ragazzi</button>
          <button data-g="quiz" data-l="adulti">Quiz adulti</button>
          <button data-g="riflessi">Riflessi</button>
          <button data-g="insieme">Insieme</button>
          <button data-g="corsa">Corsa 🏎️</button>
          <button data-g="salto">Salta 🦘</button>
          <button class="go hide" id="bnext" style="grid-column:span 2">Avanti</button>
          <button class="stop hide" id="bstop">Termina</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const LET = ['A','B','C','D'];
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

let ws, S = null;
const saved = sessionStorage.getItem('room');

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify(saved ? { t: 'rehost', code: saved } : { t: 'host' }));
  ws.onmessage = (e) => { S = JSON.parse(e.data); if (S.t === 'host') render(S); };
  ws.onclose = () => setTimeout(connect, 1200);
}

function render(s) {
  sessionStorage.setItem('room', s.code);
  $('#hcode').textContent = s.code;
  $('#hcount').textContent = s.players.length + (s.players.length === 1 ? ' giocatore' : ' giocatori');
  $('#hgame').textContent = s.game ? s.gameLabel + (s.level ? ' · ' + s.level : '') : "Sala d'attesa";

  $('#lcode').textContent = s.code;
  if (s.qr && $('#lqr').src !== s.qr) $('#lqr').src = s.qr;
  $('#lurl').textContent = s.url;

  const playing = !!s.game;
  $('#lobby').classList.toggle('hide', playing);
  $('#stage').classList.toggle('hide', !playing);
  $('#bstop').classList.toggle('hide', !playing);
  $('#menu').querySelectorAll('[data-g]').forEach((b) => b.classList.toggle('hide', playing));
  $('#names').classList.toggle('hide', playing);
  $('#board').classList.toggle('hide', !playing);

  if (!playing) {
    $('#names').innerHTML = s.players.map((p) => `<span class="name ${p.on ? '' : 'off'}">${p.ch} ${esc(p.name)}</span>`).join('');
    return;
  }
  $('#board').innerHTML = s.players.slice(0, 12)
    .map((p) => `<li><span>${p.rank}</span>${p.ch} ${esc(p.name)}<b>${p.score}</b></li>`).join('');
  $('#stagebox').innerHTML = VIEWS[s.game](s.view, s);

  // le fasi che avanzano solo su decisione dell'host espongono un'etichetta
  const lab = s.view && s.view.nextLabel;
  $('#bnext').classList.toggle('hide', !lab);
  if (lab) $('#bnext').textContent = lab;
}

function podio(s) {
  const t = s.players.slice(0, 3);
  return `<div class="big">Classifica</div>
    <ol class="board" style="margin-top:2vh">${t.map((p) => `<li><span>${'🥇🥈🥉'[p.rank - 1] || p.rank}</span>${p.ch} ${esc(p.name)}<b>${p.score}</b></li>`).join('')}</ol>
    <div class="sub" style="margin-top:2vh">Premio ai primi. Poi "Termina" per tornare al QR.</div>`;
}

function quizView(v, s) {
  if (v.phase === 'via') return `<div class="big">Si parte!</div><div class="sub">${v.tot} domande</div>`;
  if (v.phase === 'fine') return podio(s);

  if (v.phase === 'stacco')
    return `<div class="big">Segnata ✍️</div>
      <div class="sub">Domanda ${v.n}/${v.tot} chiusa · ${v.answered} risposte su ${v.players}</div>
      <div class="sub" style="margin-top:2vh">Le risposte giuste alla fine, tutte insieme.</div>`;

  // ripasso: l'host scorre le risposte giuste una per una
  if (v.phase === 'ripasso') {
    if (v.r < 0)
      return `<div class="big">Finito! 🎯</div>
        <div class="sub" style="margin-top:2vh">${v.tot} domande in cassaforte.<br>Quando vuoi, sveliamo le risposte.</div>`;
    return `<div class="sub">Risposta ${v.n}/${v.tot}</div>
      <p class="q">${esc(v.q)}</p>
      <div class="opts">${v.o.map((o, i) => `
        <div class="opt o${i} ${i === v.c ? 'win' : 'dim'}"><i>${LET[i]}</i>${esc(o)}<b>${v.counts[i]}</b></div>`).join('')}</div>`;
  }

  return `<div class="sub">Domanda ${v.n}/${v.tot} · ${v.left}s · ${v.answered} risposte</div>
    <p class="q">${esc(v.q)}</p>
    <div class="opts">${v.o.map((o, i) => `
      <div class="opt o${i}"><i>${LET[i]}</i>${esc(o)}</div>`).join('')}</div>`;
}

function corsaView(v, s) {
  if (v.phase === 'via')
    return `<div class="big">🏁</div><div class="sub">Alterna i due pedali, sinistra-destra-sinistra…<br>Sbagliare pedale ti fa sgommare.</div>`;
  if (v.phase === 'fine')
    return `<div class="big">🏁 ${v.fin.length ? esc(v.fin[0]) : 'Nessuno al traguardo'}</div>
      <div class="sub">${v.fin.slice(0, 3).map((n, i) => '🥇🥈🥉'[i] + ' ' + esc(n)).join('  ')}</div>
      ${podio(s)}`;
  return `<div class="sub">${v.left}s al termine</div>
    <div class="lanes" style="margin-top:2vh">${v.piloti.map((p, i) => `
      <div class="lane"><u>${i + 1}</u><em>${esc(p.name)}</em>
        <div class="track"><i class="${p.turbo ? 'turbo' : ''}" style="left:${Math.max(3, p.pct)}%">${p.turbo ? '🚀' : p.ch}</i></div>
        <b style="min-width:2.6em;text-align:right">${p.pct}%</b></div>`).join('')}</div>`;
}

function saltoView(v, s) {
  if (v.phase === 'via')
    return `<div class="big">🦘</div><div class="sub">🌵 a terra: <b>salta</b>. 🦅 in alto: <b>resta giù</b>.<br>Chi sbaglia esce.</div>`;
  if (v.phase === 'fine') return podio(s);
  const pct = Math.round((v.into / v.gap) * 100);
  return `<div class="sub">Ostacolo ${v.beat}/${v.tot} · ${v.vivi} ancora in pista</div>
    <div class="run">
      <div class="sign">${v.tipo === 0 ? '🌵' : '🦅'}</div>
      <div class="big" style="font-size:clamp(22px,3vw,48px)">${v.tipo === 0 ? 'SALTA!' : 'RESTA GIÙ!'}</div>
      <div class="timer"><div style="width:${pct}%"></div></div>
    </div>
    <div class="sub">${v.nomi.map((n) => n.ch + ' ' + esc(n.name)).join('  ')}</div>`;
}

const VIEWS = { quiz: quizView, riflessi: riflessiView, insieme: insiemeView, corsa: corsaView, salto: saltoView };

function riflessiView(v, s) {
  if (v.phase === 'fine') return podio(s);
  if (v.phase === 'attesa') return `<div class="light wait">ASPETTA…<br><span style="font-size:.35em;opacity:.8">round ${v.n}/${v.tot}</span></div>`;
  if (v.phase === 'verde') return `<div class="light go">TOCCA!</div>`;
  return `<div class="light res" style="flex-direction:column;gap:1vh;font-size:clamp(16px,1.6vw,26px)">
    <div class="big" style="font-size:clamp(30px,5vw,80px)">${v.best != null ? v.best + ' ms' : 'Nessuno!'}</div>
    <ol class="board" style="width:80%">${v.times.map((t) => `<li>${esc(t.name)}<b>${t.early ? 'falsa partenza' : t.ms + ' ms'}</b></li>`).join('')}</ol>
  </div>`;
}

function insiemeView(v, s) {
  if (v.phase === 'fine') return podio(s);
  if (v.phase === 'esito') return `<div class="big">${v.won ? 'FATTO! 🎉' : 'Quasi…'}</div>
    <div class="sub">Round ${v.n}/${v.tot}${v.won ? ' superato' : ' non riuscito'}</div>`;
  return `<div class="sub">Round ${v.n}/${v.tot} · ${v.left}s — battete tutti insieme!</div>
    <div class="big">${v.pct}%</div>
    <div class="bar"><div style="width:${v.pct}%"></div></div>`;
}

$('#menu').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'bstop') return ws.send(JSON.stringify({ t: 'stop' }));
  if (b.id === 'bnext') return ws.send(JSON.stringify({ t: 'next' }));
  ws.send(JSON.stringify({ t: 'start', game: b.dataset.g, level: b.dataset.l }));
});

connect();
</script>
</body>
</html>
